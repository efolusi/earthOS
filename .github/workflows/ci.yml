name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: [self-hosted, Linux, X64, efolusi]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce single-instance peer rule
        run: pnpm check-peers
      - name: Check for duplicate singleton packages
        run: pnpm dedupe --check
      - run: pnpm turbo lint typecheck build test
      - name: Format check
        run: pnpm format

  e2e:
    name: Playwright smoke (apps/web)
    runs-on: [self-hosted, Linux, X64, efolusi]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - name: Install Playwright browsers
        run: pnpm --filter @earthos/web exec playwright install --with-deps chromium
      - run: pnpm turbo e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  examples:
    name: Bundler compatibility (examples)
    runs-on: [self-hosted, Linux, X64, efolusi]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build examples against built packages
        run: pnpm turbo build --filter='./examples/*'
